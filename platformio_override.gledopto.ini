# platformio_override.gledopto.ini
#
# Versioned reference copy of the local platformio_override.ini.
# WLED's upstream .gitignore excludes platformio_override.ini, so this companion
# file exists to track build profile changes in git. To use:
#
#     cp platformio_override.gledopto.ini platformio_override.ini
#
# Then edit the local copy (gitignored) for any per-machine tweaks. Sync changes
# back to this file when you want them committed.
#
# Targets two ESP32 build environments based on MoonModules/WLED:
#   * esp32dev_mm           — generic MoonModules build (audioreactive +
#                             Temperature + multi_relay + custom_fx + ARTI-FX,
#                             plus Ethernet support so the same binary boots on
#                             non-eth boards).
#   * esp32dev_mm_gledopto  — GLEDOPTO GL-C-618WL build (same usermods +
#                             board-specific pin map, ETH auto-selected).

[platformio]
default_envs = esp32dev_mm

[env:esp32dev_mm]
extends = env:esp32dev_V4
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
board_build.partitions = ${esp32_idf_V4.default_partitions}
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${esp32_idf_V4.build_flags}
    -D WLED_RELEASE_NAME=ESP32_mm_usermods
    -D WLED_USE_ETHERNET               ; required for GLEDOPTO Elite (ETH type 13 in UI)
    ; --- preloaded MoonModules usermods ---
    ${esp32.AR_build_flags}            ; audioreactive (also pulls AR_lib_deps below)
    -D USERMOD_DALLASTEMPERATURE       ; DS18B20 temperature sensor
    -D USERMOD_MULTI_RELAY             ; multi-relay control
    -D USERMOD_CUSTOM_FX               ; local custom-effect scaffold
    -D USERMOD_ARTIFX                  ; runtime ARTI-FX scripting
    -D USERMOD_CLOCKSYNC               ; SNTP smooth clock sync between nodes

lib_deps =
    ${esp32_idf_V4.lib_deps}
    ${esp32.AR_lib_deps}
    paulstoffregen/OneWire @ ^2.3.7    ; required by USERMOD_DALLASTEMPERATURE

# ------------------------------------------------------------------------------
# GLEDOPTO GL-C-618WL — board-specific defaults pulled from
# https://github.com/GLEDOPTO/WLED (gledopto-0.15.4 platformio_override.ini).
# DATA_PINS use the user-confirmed output set (16, 12, 4, 2); GLEDOPTO upstream
# instead lists 14 in place of 12 — flip back if a different board revision is
# in use.
# ------------------------------------------------------------------------------
[env:esp32dev_mm_gledopto]
extends = env:esp32dev_V4
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
board_build.partitions = ${esp32_idf_V4.default_partitions}
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${esp32_idf_V4.build_flags}
    -D WLED_RELEASE_NAME=ESP32_GLEDOPTO
    -D WLED_USE_ETHERNET
    -D WLED_ETH_DEFAULT=13               ; auto-pick GLEDOPTO ETH profile at boot
    -D WLED_BRAND="\"GLEDOPTO\""
    -D SERVERNAME='"WLED-GLEDOPTO"'
    ; --- MoonModules usermods (same set as esp32dev_mm) ---
    ${esp32.AR_build_flags}
    -D USERMOD_DALLASTEMPERATURE
    -D USERMOD_MULTI_RELAY
    -D USERMOD_CUSTOM_FX
    -D USERMOD_ARTIFX
    -D USERMOD_CLOCKSYNC
    ; --- GL-C-618WL hardware defaults ---
    -D RLYPIN=18 -D RLYMDE=true          ; onboard relay
    -D BTNPIN=17 -D BTNTYPE=2            ; onboard button (BTN_TYPE_PUSH)
    -D UM_AUDIOREACTIVE_ENABLE           ; mic enabled by default
    -D SR_DMTYPE=5                       ; PDM microphone
    -D I2S_SDPIN=32                      ; PDM data
    -D I2S_WSPIN=15                      ; PDM word-select / clock
    -D I2S_CKPIN=-1
    -D MCLK_PIN=-1
    -D SOUND_AGC=2 -D SR_SQUELCH=4       ; tuned audio defaults
    -D DATA_PINS=16,12,4,2               ; user-confirmed LED outputs
    -D DEFAULT_LED_TYPE=22               ; WS2811
    -D DEFAULT_LED_COLOR_ORDER=0         ; GRB
    -D DEFAULT_LED_COUNT=30

lib_deps =
    ${esp32_idf_V4.lib_deps}
    ${esp32.AR_lib_deps}
    paulstoffregen/OneWire @ ^2.3.7
